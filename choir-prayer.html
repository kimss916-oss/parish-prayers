<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f8f7f4">
<title>성가대를 위한 기도</title>
<style>
:root{--fs:19px}*{box-sizing:border-box}
body{margin:0;background:#f8f7f4;color:#242522;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}
.tools{position:sticky;top:0;z-index:2;background:#fff;display:flex;justify-content:flex-end;gap:8px;padding:8px 12px;border-bottom:1px solid #eee}
.tools button{min-width:48px;min-height:40px;font-size:15px;border:1px solid #ddd;background:#fff;border-radius:8px;padding:8px 14px;cursor:pointer}
header{background:#fff;border-bottom:1px solid #e7e5df;padding:23px 18px;text-align:center}
h1{font-size:25px;margin:0}
main{max-width:720px;min-height:calc(100dvh - 130px);margin:auto;background:#fff;padding:32px 20px 50px}
p{font-size:var(--fs);line-height:1.85;letter-spacing:-.035em;word-break:keep-all;overflow-wrap:break-word;margin:0 0 28px}
p:last-child{margin-bottom:0}
@media(min-width:740px){main{padding-left:45px;padding-right:45px}}
@media(max-width:370px){main{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<div class="tools"><button type="button" aria-label="글자 축소" onclick="change(-1)">가−</button><button type="button" aria-label="글자 확대" onclick="change(1)">가+</button></div>
<header><h1>성가대를 위한 기도</h1></header>
<main>
<p>빛과 사랑으로 세상을 창조하신 천주여<br>크신 은총 표현할 길 없사오나<br>찬송과 영광 바치려 저희가 모였사오니<br>미약한 정성 받아들이소서</p>
<p>저희들의 노래가 풍성하고 만족한<br>미사의 제물이 되고<br>공동체를 이루는 끈이 되게 하소서</p>
<p>저희들은 상처입은 많은 이들을 대신하여<br>성가대의 소명을 입었음을 잊지 말게 하시어<br>항상 영롱하고 아름다운 소리와<br>장엄하고 열정이 넘치는 가슴으로<br>노래하게 하소서</p>
<p>작은 새의 지저귐과 시냇물 흐르는 소리를<br>사랑하는 성가대의 공동체인 우리는<br>주님 안에서 한마음으로 노래하나이다</p>
</main>
<script>let size=19;function change(n){size=Math.max(16,Math.min(27,size+n));document.documentElement.style.setProperty('--fs',size+'px')}</script>
</body>
</html>
