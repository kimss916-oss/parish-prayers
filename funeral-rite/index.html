<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#285b50"><title>상장 예식 · 연도</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#172b26;background:#f5f7f5}*{box-sizing:border-box}body{margin:0}header{background:#285b50;color:white;padding:17px 14px;text-align:center;position:relative}header small{font-size:11px;color:#d8e9e1}header h1{font-size:20px;margin:5px 0 0}header a{position:absolute;left:12px;top:21px;color:#e2eee8;text-decoration:none;font-size:12px;border:1px solid #769b8e;border-radius:7px;padding:6px 8px}main{max-width:760px;margin:auto;padding:18px 14px 100px}.sub{color:#64736d;font-size:13px;margin:4px 0 16px}.group{background:white;border:1px solid #e1e9e3;border-radius:13px;margin-bottom:13px;overflow:hidden}.group h2{font-size:16px;margin:0;padding:15px 16px 10px}.entry{width:100%;background:white;border:0;border-top:1px solid #edf1ed;text-align:left;padding:14px 16px;font-size:15px;color:#213b32;display:flex;justify-content:space-between;align-items:center;cursor:pointer}.entry:active{background:#f1f7f3}.entry em{font-style:normal;font-size:12px;color:#71817a}.hidden{display:none!important}.toolbar{position:sticky;top:0;background:#f5f7f5;padding:9px 0;display:flex;align-items:center;gap:8px;z-index:2;flex-wrap:wrap}.toolbar button,.toolbar input{border:1px solid #c8d6ce;background:white;border-radius:8px;padding:9px 11px;font-size:14px;color:#285b50}.toolbar button{cursor:pointer}.toolbar input{width:64px;text-align:center}.toolbar strong{flex:1;font-size:14px}.page{margin:10px auto 24px;text-align:center}.page iframe{width:100%;height:72vh;min-height:520px;border:1px solid #d9e3dc;background:white}.page canvas{max-width:100%;height:auto;box-shadow:0 2px 10px #0002;background:white}.foot{font-size:12px;color:#66756e;text-align:center;margin:18px 0}#error{color:#a33;font-size:13px}.zoom{display:flex;gap:6px}button:focus-visible{outline:3px solid #80b3a0}</style></head><body>
<header><a href="#" id="home" class="hidden">‹ 목차</a><small>마니피캇 성가대</small><h1>상장 예식 · 연도</h1></header>
<main><section id="toc"><p class="sub">원하는 예식 또는 기도를 선택하면 해당 페이지로 이동합니다.</p><div class="group"><h2>위령 기도 (연도)</h2><button class="entry" data-menu="long"><b>긴 연도</b><em>9개 항목 ›</em></button><button class="entry" data-menu="short"><b>짧은 연도</b><em>6개 항목 ›</em></button></div><div class="group"><h2>그 밖의 예식</h2><button class="entry" data-page="52">밤샘 예식 (영문)<em>52쪽 ›</em></button><button class="entry" data-page="53">밤샘 예식 (말씀 전례)<em>53쪽 ›</em></button><button class="entry" data-page="64">장례미사<em>64쪽 ›</em></button><button class="entry" data-page="77">하관예식<em>77쪽 ›</em></button><button class="entry" data-page="84">필요한 성가<em>84쪽 ›</em></button></div><p class="foot">자료: 워싱톤 한인 천주교회 「상장 예식」 · 94쪽</p></section>
<section id="submenu" class="hidden"><p class="sub" id="subdesc"></p><div class="group" id="subitems"></div><button class="entry" id="backToc">‹ 전체 목차</button></section>
<section id="viewer" class="hidden"><div class="toolbar"><button id="back">‹ 목차</button><strong id="chapter">상장 예식</strong><button id="prev" aria-label="이전 페이지">‹</button><input id="num" type="number" min="1" max="94" aria-label="페이지 번호"><span>/ 94</span><button id="next" aria-label="다음 페이지">›</button><div class="zoom"><button id="minus">−</button><button id="plus">＋</button></div></div><div id="error"></div><div class="page"><canvas id="canvas"></canvas><iframe id="fallback" class="hidden" title="상장 예식 PDF"></iframe></div><p class="foot"><a href="상장예식.pdf" target="_blank" rel="noopener">PDF 원본 열기</a> · <span>기본 PDF 보기에서는 페이지 이동이 기기에 따라 다를 수 있습니다.</span></p></section></main>
<script type="module">
const PDF='./상장예식.pdf';const items=[['상가 방문 시작 기도',4],['시편 62(63)',6],['시편 129(130)',10],['시편 50(51)',14],['성인 호칭기도',22],['기도문',38],['찬미와 간구',40],['주님의 기도',49],['마침 기도',51]];const short=[0,2,3,5,7,8];let pdfjs,pdf,scale=1,page=4,renderToken=0,section='toc',prior='toc',fallbackMode=false;const $=id=>document.getElementById(id);const show=s=>{section=s;['toc','submenu','viewer'].forEach(k=>$(k).classList.toggle('hidden',k!==s));$('home').classList.toggle('hidden',s==='toc');scrollTo(0,0)};function menu(which){prior='submenu';$('subdesc').textContent=which==='long'?'긴 연도 · 순서대로 필요한 기도를 선택하세요.':'짧은 연도 · 필요한 기도만 모았습니다.';$('subitems').innerHTML='';(which==='long'?items:short.map(i=>items[i])).forEach(([name,n])=>{const b=document.createElement('button');b.className='entry';b.innerHTML='<span></span><em>'+n+'쪽 ›</em>';b.firstElementChild.textContent=name;b.onclick=()=>openPage(n,name);$('subitems').append(b)});show('submenu')}
async function load(){if(pdf)return;const mod=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');pdfjs=mod;pdfjs.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';pdf=await pdfjs.getDocument({url:PDF}).promise;$('num').max=pdf.numPages;document.querySelector('#viewer .toolbar span').textContent='/ '+pdf.numPages}
function showFallback(){fallbackMode=true;$('canvas').classList.add('hidden');$('fallback').classList.remove('hidden');$('fallback').src=PDF+'#page='+page+'&zoom=page-width';$('minus').disabled=true;$('plus').disabled=true;}
async function draw(){const token=++renderToken;$('num').value=page;if(fallbackMode){showFallback();return;}$('error').textContent='';try{await load();const pg=await pdf.getPage(page);if(token!==renderToken)return;const viewport=pg.getViewport({scale:1});const target=Math.min(window.innerWidth-28,760);const ratio=Math.min(2,devicePixelRatio||1);const renderScale=(target/viewport.width)*scale;const v=pg.getViewport({scale:renderScale*ratio});const canvas=$('canvas');canvas.width=Math.round(v.width);canvas.height=Math.round(v.height);canvas.style.width=Math.round(v.width/ratio)+'px';canvas.style.height=Math.round(v.height/ratio)+'px';await pg.render({canvasContext:canvas.getContext('2d'),viewport:v}).promise}catch(e){if(token===renderToken){$('error').textContent='PDF.js 뷰어를 불러오지 못해 기본 PDF 보기로 전환했습니다. 아래 PDF가 보이지 않으면 「PDF 원본 열기」를 눌러 주세요. ('+(e?.message||String(e))+')';showFallback();console.error(e)}}}
function openPage(n,name){prior=section==='submenu'?'submenu':'toc';page=n;$('chapter').textContent=name||'상장 예식';show('viewer');draw()}
function back(){show(prior==='submenu'?'submenu':'toc')};document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>menu(b.dataset.menu));document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>openPage(+b.dataset.page,b.textContent.replace(/\d+쪽.*/,'')));$('backToc').onclick=()=>show('toc');$('back').onclick=back;$('home').onclick=e=>{e.preventDefault();section==='viewer'?back():show('toc')};$('prev').onclick=()=>{if(page>1){page--;draw()}};$('next').onclick=()=>{if(page<(pdf?.numPages||94)){page++;draw()}};$('num').onchange=e=>{const n=+e.target.value;if(n>=1&&n<=(pdf?.numPages||94)){page=n;draw()}else e.target.value=page};$('plus').onclick=()=>{scale=Math.min(3,scale+.25);draw()};$('minus').onclick=()=>{scale=Math.max(.75,scale-.25);draw()};
</script></body></html>
